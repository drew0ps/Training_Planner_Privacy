<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrainingPlanner - Support</title>
<!-- The support page is on the app's website since 18 November 2026. GitHub Pages can't answer
     with a redirect, so this page sends the browser on; the link is for a browser that doesn't
     follow. -->
<link rel="canonical" href="https://trainingplanner.pro/support.html">
<meta http-equiv="refresh" content="0; url=https://trainingplanner.pro/support.html">
<style>
  :root {
    color-scheme: light dark;
    --bg: #F4F5F6; --text: #2E3640; --accent: #3A7478;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #222831; --text: #EEEEEE; --accent: #76ABAE; }
  }
  body {
    margin: 0; padding: 48px 20px;
    background: var(--bg); color: var(--text);
    font: 1.0625rem/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 2rem; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px; }
  p { margin: 0; }
  a { color: var(--accent); text-underline-offset: 0.15em; }
</style>
</head>
<body>
<main>
  <h1>Support</h1>
  <p>TrainingPlanner's support page has moved to
    <a href="https://trainingplanner.pro/support.html">trainingplanner.pro/support.html</a>.</p>
</main>
</body>
</html>
